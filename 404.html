<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 | Eng Shuayb</title>
<style>
:root{--bg:#07142a;--tx:#e6f0ff;--mu:#9db4d6;--g:#38bdf8;--bd:#1d3a66;--on:#04110a}
@media (prefers-color-scheme:light){:root{--bg:#fff;--tx:#10201a;--mu:#4d5f55;--g:#1d4ed8;--bd:#d3e3d8;--on:#fff}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
main{max-width:460px}
h1{margin:0;font:700 clamp(64px,22vw,120px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--g)}
p{color:var(--mu);font-size:18px;line-height:1.5}
a{display:inline-block;margin-top:8px;padding:12px 24px;border-radius:99px;background:var(--g);color:var(--on);font-weight:700;text-decoration:none}
a:focus-visible{outline:3px solid var(--tx);outline-offset:3px}
button{margin-top:16px;background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
</style>
</head>
<body>
<main>
<h1>404</h1>
<p id="m">This page does not exist. Maybe the link is old or mistyped.</p>
<a id="h" href="/">Back to home</a><br>
<button id="l" type="button">SO</button>
</main>
<script>
(function(){var so=false,T={en:['This page does not exist. Maybe the link is old or mistyped.','Back to home','SO'],so:['Bogganma jiro. Laga yaabaa in linkigu duug yahay ama khalad la qoray.','Ku noqo bogga hore','EN']};
function r(){var t=T[so?'so':'en'];document.documentElement.lang=so?'so':'en';document.getElementById('m').textContent=t[0];document.getElementById('h').textContent=t[1];document.getElementById('l').textContent=t[2]}
try{so=localStorage.getItem('lang')==='so'}catch(e){}
document.getElementById('l').onclick=function(){so=!so;try{localStorage.setItem('lang',so?'so':'en')}catch(e){}r()};r()})();
</script>
</body>
</html>
